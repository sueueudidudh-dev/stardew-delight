modLoader="javafml"
loaderVersion="${loader_range}"
license="MIT"
issueTrackerURL="https://github.com/sueueudidudh-dev/stardew-delight/issues"

[[mods]]
modId="${id}"
version="${version}"
displayName="${name}"
authors="${author}"
displayURL="https://modrinth.com/mod/stardew-delight"
logoFile="stardewdelight_logo.png"
credits="Блюда и идея — Stardew Valley (ConcernedApe). Farmer's Delight — vectorwing."
description='''
Аддон для Farmer's Delight: 78 блюд из Stardew Valley (яичница и хлеб — из FD и ванили).
Блюда готовятся в кастрюле, на разделочной доске и на верстаке из ингредиентов Farmer's Delight.
Баффы Stardew + эффекты «Сытость» и «Уют» из Farmer's Delight, а также Магнетизм и Иммунитет к дебаффам.
'''

[[dependencies.${id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${id}]]
    modId="farmersdelight"
    mandatory=true
    versionRange="${fd_range}"
    ordering="AFTER"
    side="BOTH"
