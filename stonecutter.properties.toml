# Version- and loader-specific values, read in the build scripts as sc.properties["..."]
# See https://stonecutter.kikugie.dev/wiki/v2/reference/gradle-api/structured-properties
#
#   mod.mc_releases  Minecraft releases to tag on Modrinth / CurseForge
