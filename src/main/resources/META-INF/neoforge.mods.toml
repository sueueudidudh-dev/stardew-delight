modLoader="javafml"
loaderVersion="${loader_range}"
license="All Rights Reserved"
issueTrackerURL="https://github.com/sueueudidudh-dev/stardew-delight/issues"

[[mods]]
modId="${id}"
version="${version}"
displayName="${name}"
authors="${author}"
displayURL="https://modrinth.com/mod/stardew-delight"
logoFile="stardewdelight_logo.png"
credits="Блюда и идея — Stardew Valley (ConcernedApe). Farmer's Delight — vectorwing. Аддон — Karasik."
description='''
Аддон для Farmer's Delight: вся еда из Stardew Valley (78 блюд + яичница и хлеб из FD/ванили).
Блюда готовятся в кастрюле, на разделочной доске и на верстаке из ингредиентов Farmer's Delight.
Баффы Stardew + эффекты «Сытость» и «Уют» из Farmer's Delight, а также Магнетизм и Иммунитет к дебаффам.
'''

[[mixins]]
config="${id}.mixins.json"

[[dependencies.${id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${id}]]
    modId="farmersdelight"
    type="required"
    versionRange="${fd_range}"
    ordering="AFTER"
    side="BOTH"
